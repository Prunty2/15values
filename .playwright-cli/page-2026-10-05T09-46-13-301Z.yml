          - paragraph [ref=e562]: "Assessed period: Mao Zedong Thought, 1927–1976; modern applications inferred. Provisional AI assessment of Maoism; Mao Zedong Thought, 1927–1976; modern applications inferred. New Democracy permits private capitalist production that does not dominate livelihoods and private peasant holdings before later socialist transformation. The 1927–1976 scope cannot silently erase this transitional exception. Party-led class participation differs from equal opposition access and independent courts. Every question has a most-likely interpretation, disclosed as an inferred educated assumption; exact response strength and historical applications remain estimates. This is a distinct same-agent assessment/review, not external peer certification or a survey of adherents."
