name: Validate application and profiles
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Preserve previously committed assessments and images
        if: github.event_name == 'pull_request'
        env:
          PROFILE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run profiles -- history "$PROFILE_BASE_SHA"
      - run: npm run questions:check
      - run: npm run profiles:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results/
